// Local TEST server config (scripts/local_server.sh). Not used on the GSP.
hostname = "DZDS local test";
password = "";                  // LAN only; set one if you open the port
passwordAdmin = "changeme-admin";
maxPlayers = 4;
verifySignatures = 2;
forceSameBuild = 1;
disableVoN = 0;
vonCodecQuality = 30;
disable3rdPerson = 1;           // first-person only (decided 2026-10-05)
disableCrosshair = 1;           // no HUD crosshair: aim with sights/optics
disablePersonalLight = 1;       // no invisible "personal light" at night
lightingConfig = 1;             // dark nights (vanilla); Blae 2026-10-07 (panel: Darker Nights = 1)
enableCfgGameplayFile = 1;      // use mission cfggameplay.json (presets/overlays/cfggameplay.yaml)
serverTime = "SystemTime";
serverTimeAcceleration = 4;     // 24 h in-game = 6 h real
serverNightTimeAcceleration = 8; // nights 4x8 = 32x: short (~15-20 min real), Blae 2026-10-07
serverTimePersistent = 1;
guaranteedUpdates = 1;
loginQueueConcurrentPlayers = 5;
loginQueueMaxPlayers = 500;
instanceId = 1;
storageAutoFix = 1;
class Missions
{
    class DayZ
    {
        template = "__MISSION__";
    };
};
