# Single source of truth for the mod loadout.
#
# tier:     load order bucket (spec §6C). 1 core → 2 gameplay/AI → 3 vehicles/base → 4 UI/admin.
#           Within a tier, list order is preserved.
# folder:   directory name on the server (what goes into -mod=). Match what the GSP panel shows.
# side:     "both" (-mod=, clients need it) or "server" (-serverMod=, server-only).
# enabled:  false keeps an entry documented but out of the launch string.
# verified: ID resolved against the Steam Workshop API and title confirmed
#           (`make verify-mods`). Says nothing about in-game compatibility. That's `tested`.
# tested:   flip to true after the Phase 4 playtest confirms it works on the current game version.
# replaces: set when an entry substitutes a spec exemplar that doesn't exist or was swapped.
#
# 2026-10-05: 26 of the 30 IDs in docs/SPEC.md were wrong or pointed at nonexistent
# items. Corrected below via Workshop search; see docs/MOD_AUDIT.md.

