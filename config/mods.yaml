# Single source of truth for the mod loadout.
#
# tier: load order bucket (spec §6C). 1 core → 2 gameplay/AI → 3 vehicles/base → 4 UI/admin.
#       Within a tier, list order is preserved.
# folder: directory name on the server (what goes into -mod=). Keep it free of spaces when
#         possible. Many GSP panels rename on install, so match what the panel shows.
# side: "both" (-mod=) or "server" (-serverMod=, not required on clients).
# enabled: false to keep an entry documented but out of the launch string.
# verified: flip to true once the workshop ID, dependencies and current-game-version
#           compatibility have been checked on the Workshop page.
#
# IDs below are copied from docs/SPEC.md and have NOT been verified yet.

