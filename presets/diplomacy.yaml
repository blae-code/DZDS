# Dynamic diplomacy (docs/FACTIONS.md). tools/diplomacy.py writes the ACTIVE entries to
# server/profiles/DZDS/diplomacy.json, which @DZDS reads at server start. Changes apply at the
# next restart, the same cadence as the war ledger.
#
# from/to: preset faction names (Settlers, Peacekeepers, Jackals, Karkas, Rust).
# stance: friendly | hostile  (one direction; add the reverse entry for a mutual change)
# until: optional YYYY-MM-DD; expired entries are dropped automatically.
# For PLAYERS, Expansion asks the players' faction: to make the UN shoot players, override
# Settlers -> Peacekeepers.
#
# Examples (commented out; the war ledger / GM will add these as events happen):
overrides:
  # Task Force Blue Shield Humanitarian Corridor Accord: Settlers & Peacekeepers mutual protection
  - { from: Settlers, to: Peacekeepers, stance: friendly, why: "UN Blue Shield Humanitarian Corridor Accord" }
  - { from: Peacekeepers, to: Settlers, stance: friendly, why: "UN Blue Shield Humanitarian Corridor Accord" }

  # Guzoline Pipeline Sabotage Feud: Rust Syndicate & Jackal Cohort active conflict
  - { from: Rust, to: Jackals, stance: hostile, why: "Guzoline pipeline sabotage feud" }
  - { from: Jackals, to: Rust, stance: hostile, why: "Guzoline pipeline sabotage feud" }

  # Aquifer Drilling Dispute: Karkas Mountain Clan & Rust Syndicate high-ground friction
  - { from: Karkas, to: Rust, stance: hostile, why: "Aquifer drilling boundary dispute" }
  - { from: Rust, to: Karkas, stance: hostile, why: "Aquifer drilling boundary dispute" }
