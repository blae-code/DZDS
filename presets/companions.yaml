# ==============================================================================
# Hirable NPC Companions: Qalat-e Lut Fortress Garrison & Expedition Roster
# ==============================================================================
# Single source of truth for specialized settler companions stationed at
# Qalat-e Lut (Frontier Settlers HQ, [14837, 7855]).
#
# Gameplay integration:
#   1. In-game recruitment: NPCs spawn as eAIFactionDZDSSettlers with
#      CanRecruitFriendly: 1 (AISettings.json). Walk up and use Expansion's
#      recruitment interaction to add them to your squad (eAIGroup).
#   2. Command & control: Use Expansion AI command wheel (Follow, Stay/Hold,
#      Cover, Move, Formation). Companions board vehicles with the player and
#      engage hostile tribes (Jackals, Karkas, Rust) and infected.
#   3. Inventory management: Look at a recruit and open inventory to transfer
#      gear, weapons, ammunition, or healing supplies.
#   4. Stationing at Qalat-e Lut: Dismissing a companion returns them to their
#      assigned post at Qalat-e Lut, reinforcing compound security.
#   5. Hiring retainers: Players can negotiate contracts directly or through
#      Elder Tariq's enlistment contracts at the courtyard.

settlement:
  id: "qalat_e_lut"
  name: "Qalat-e Lut Fortress"
  hq_coordinates: [14837.0, 0.0, 7855.0]
  faction: "DZDSSettlers"
  max_squad_size: 4

command_guide:
  recruit_action: "Look at the companion and press the Interaction key (F / Middle Click) to recruit."
  squad_wheel: "Use the Expansion AI command wheel (default: comma ',' or middle-click) to give orders."
  orders:
    - name: "Follow Me"
      desc: "Companion maintains formation and travels with you on foot or in vehicles."
    - name: "Hold / Stay Here"
      desc: "Companion anchors at the target spot to guard a watchtower, gate, or camp."
    - name: "Cover Me / Attack"
      desc: "Designates rules of engagement or attacks a specific enemy squad."
    - name: "Vehicle Travel"
      desc: "Companion automatically boards passenger seats when you enter a vehicle."
    - name: "Dismiss / Return"
      desc: "Dismisses companion from your group; they resume garrison duties at Qalat-e Lut."

companions:
  soran_scout:
    id: "soran_scout"
    name: "Soran the Scout"
    title: "Desert Tracker & Marksman"
    gender: "male"
    entity_class: "SurvivorM_Mirek"
    loadout: "DZDS_Settlers_scout"
    position: [14865.0, 0.0, 7970.0]
    orientation: [0.0, 0.0, 0.0]
    station: "North Watchtower & Dunes Staging"
    specialization: "Reconnaissance, Tracking & Precision Fire"
    description: "Born in the badlands, Soran tracks dust trails and spots raider ambushes well before they close range."
    bark: "I know every dune between here and the border. Keep your eyes on the ridge."
    primary_weapon: "CZ527 Scoped Carbine"
    secondary_weapon: "Hunting Knife & Binoculars"
    role_perks:
      - "+40% threat detection distance in desert terrain"
      - "Equipped with binoculars and compass for waypoint guidance"
      - "Silent stalking stance in rocky outcroppings"
    retainer_cost:
      - item: "Canteen"
        amount: 1
        desc: "Purified water canteen"
      - item: "Mag_CZ527_5rnd"
        amount: 1
        desc: "5-round 7.62x39 magazine"

  kaveh_guard:
