# KAN Survivor NPC camps: per-camp role counts (RoleOverrides in profiles/KANSurvivorNPC/camps.json).
# Applied by tools/kan_camps.py (`make kan-camps`). camps.json is live state the mod rewrites
# every ~10 min and at shutdown, so apply it with the server STOPPED, right before a push.
#
# From the mod's source (KAN_CampData.c ClampForAdminPlacement): Roamers, Looters and Snipers
# may be 0; Builders, Guards and Attackers are clamped to at least 1. An all-zero override is
# discarded ("use blueprint defaults"), so always give the full set.
# Attackers only raid when the camp is HOSTILE (KAN_NPCCamp.CanDiscoverTargets); a FRIENDLY
# camp's attackers hold a post near the camp.
#
# Blae, 2026-10-12: no wanderers or raiders. Roamers do "unrestricted world roaming".
camps:
# Nasdara (2026-10-15 local 1.30 boot): KAN generated no new camp, so the one camp it already has
# is moved to the Settlers' only stronghold. The Id is KAN's and keeps its Chernarus name.
  Balota_Survivor_Camp:          # FRIENDLY; MilitaryCheckpoint blueprint default 2/4/2/5/2/1
    site: Settler Haven
    Roamers: 0                   # was 2
    Looters: 4
    Builders: 2
    Guards: 5
    Attackers: 1                 # was 2; the mod's floor is 1, and a friendly camp never raids
    Snipers: 1
