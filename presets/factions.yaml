# Living-world faction design (docs/LIVING_WORLD.md), mapped onto Expansion AI's REAL
# built-in factions.
#
# Facts from the Expansion source (DayZExpansion/AI/Scripts/.../Factions/*.c):
#   - Factions are compiled script classes. Relations are hard-coded in IsFriendly(); there
#     is NO JSON faction config (the spec's profiles/ExpansionMod/AI/Factions/ doesn't exist).
#   - A patrol picks its faction by name ("Faction": "East" in AIPatrolSettings.json).
#   - Custom factions/relations need a small script mod (planned: @DZDS, see design doc).
#   - Players can be auto-assigned a faction on connect via AISettings.PlayerFactions.
#
# `engine_faction` is the Expansion class used; `stance` documents the resulting behaviour
# (derived from the source, so tests can check our intent matches what the engine does).
# Stance toward Players depends on the player-alignment option chosen (docs, open decision 1).

factions:
  CDF:
    engine_faction: West
    lore: Chernarus Defence Forces remnant. Disciplined, holds military sites and airfields,
      escorts fuel and arms between bases. Protects civilians.
    stance: { CDF: friendly, ChDKZ: hostile, Raiders: hostile, Survivors: friendly, Infected: hostile }
    loadout: WestLoadout        # Expansion default; replace with a CDF-themed loadout file
    holds_roles: [military, airfield]
  ChDKZ:
    engine_faction: East
    lore: Insurgent militia holding the industrial east and north. Takes fuel and
      factories, raids CDF supply. Tolerates civilians.
    stance: { ChDKZ: friendly, CDF: hostile, Raiders: hostile, Survivors: friendly, Infected: hostile }
    loadout: EastLoadout
    holds_roles: [industrial, road_junction]
  Raiders:
    engine_faction: Raiders
    lore: Bandit crews. Hostile to everyone, hunt convoys, survivors and stragglers.
    stance: { Raiders: friendly, CDF: hostile, ChDKZ: hostile, Survivors: hostile, Infected: hostile }
    loadout: BanditLoadout
    holds_roles: [remote]
  Survivors:
    engine_faction: Civilian
    lore: Scavengers and families in the towns. Never start fights; prey for Raiders.
    stance: { Survivors: friendly, CDF: friendly, ChDKZ: friendly, Raiders: friendly, Infected: hostile }
    loadout: SurvivorLoadout
    holds_roles: [inland_town, coastal_town]
  Infected:
    engine_faction: null   # vanilla zombies sit OUTSIDE the faction system and attack every
                           # human; Expansion's "Infected" faction is a human-AI faction, unused
    lore: Vanilla zombies; the universal enemy.
    stance: { Infected: friendly, CDF: hostile, ChDKZ: hostile, Raiders: hostile, Survivors: hostile }

# Spec mapping: spec "Survivors" = Survivors; spec "Raiders" = Raiders; spec "Guards" is split
# into CDF and ChDKZ, two mutually hostile armies, which gives the war a front line.
# Expansion's own "Guards" faction stays reserved for static site defenders if needed.

# ---- Resources: what the war is fought over -------------------------------------------
# Each resource comes from sites of certain map ROLES (maps/_roles.yaml), so this ports to
# Nasdara. Holding sites yields income per restart cycle; income buys effects.
resources:
  fuel:
    from_roles: [industrial]
    effect: convoy frequency and vehicle patrols for the holder
  arms:
    from_roles: [military, airfield]
    effect: better loadouts (accuracy stays inside spec bounds)
  food:
    from_roles: [inland_town]
    effect: reinforcement rate (patrol size / respawn time)
  medicine:
    from_roles: [coastal_town]
    effect: garrison resilience (DamageReceivedMultiplier slightly below 1.0)

# ---- Initial front line for ChernarusPlus (campaign start) -------------------------------
# Location names from maps/chernarusplus.yaml. The war ledger evolves this over restarts.
initial_control:
  chernarusplus:
    CDF: [Balota Airfield, Northwest Airfield, Zelenogorsk, Chernogorsk]
    ChDKZ: [Berezino, Krasnostav, Severograd, Novodmitrovsk, Elektrozavodsk]
    Raiders: [Tisy Military]
    contested: [Stary Sobor, Gorka, Vybor]   # no holder; War Zones fight here

# Shared combat calibration (same bounds as presets/expansion_ai_calibration.yaml).
combat:
  AccuracyMin: 0.28
  AccuracyMax: 0.48
  ThreatDistanceLimit: 280.0
