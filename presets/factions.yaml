# Faction design: the user's Faction Architecture Blueprint (2026-10-05), mapped onto what
# DayZ Expansion AI actually supports. Full write-up: docs/FACTIONS.md.
#
# Engine facts (Expansion source):
#   - Factions are compiled script classes; there are no Faction_*.json files. Ours live in
#     mods/DZDS/Scripts/3_Game/DZDS/Factions/DZDSFactions.c (@DZDS mod).
#   - custom_faction: the @DZDS class name used in patrols ("Faction": "DZDSJackals").
#   - interim_faction: closest Expansion built-in, used until @DZDS is built and signed.
#   - Stance is the ROW faction's IsFriendly() toward the column. "neutral" = IsFriendly true
#     but provocation (aiming, hitting, firing) makes them fight: Expansion's threat system.
#   - Players join DZDSSettlers via AISettings PlayerFactions (presets/overlays/expansion_ai.yaml).
#
# behaviour: per-patrol AIPatrolSettings fields (names/values from Expansion's source):
#   Behaviour HALT|LOOP|ALTERNATE|ONCE|HALT_OR_LOOP|HALT_OR_ALTERNATE|LOOP_OR_ALTERNATE|ROAMING|ROAMING_LOCAL
#   Speed/UnderThreatSpeed WALK|JOG|SPRINT|RANDOM|RANDOM_NONSTATIC   DefaultStance STANDING|CROUCHED|PRONE
#   Formation Column|File|Vee|Wall|RANDOM   LootingBehaviour flags: DEFAULT|ALL|WEAPONS|FOOD|BANDAGES|CLOTHING|UPGRADE|NONE
#   (combine with "|"). NO PATROL LOOTS FOOD (Blae, 2026-10-12): food stays at vanilla scarcity,
#   and AI picking it off the ground made it rarer than vanilla. ALL includes FOOD, so use the
#   explicit non-food set instead. tests/test_presets.py enforces this.
# Accuracy per faction must stay inside PATROL bounds (tools/apply_ai_calibration.py):
#   AccuracyMin 0.20–0.35, AccuracyMax 0.35–0.52, ThreatDistanceLimit <= 300.

factions:
  Settlers:
    display: Frontier Settlers
    custom_faction: DZDSSettlers
    interim_faction: Civilian
    lore: Displaced civilians, mechanics and survivalists; the core of the player's settlement network.
    player_standing: allied (players are members)
    stance: { Settlers: friendly, Peacekeepers: neutral, Jackals: hostile, Karkas: hostile, Rust: hostile, Infected: hostile }
    recruitable: true
    behaviour:
      Behaviour: HALT_OR_LOOP
      Speed: WALK
      UnderThreatSpeed: SPRINT
      DefaultStance: STANDING
      Formation: File
      FormationLooseness: 0.4
      AccuracyMin: 0.22
      AccuracyMax: 0.38
      ThreatDistanceLimit: 180.0
      NoiseInvestigationDistanceLimit: 80.0
      EnableFlankingOutsideCombat: 0
      LootingBehaviour: NONE                   # was FOOD (no food looting, 2026-10-12)
      CanBeLooted: true
    loadout:
      apparel: [hunting jackets, hiking jackets, work shirts, hoodies, denim/quilted jackets, jeans, cargo pants, work boots, hiking boots, beanies, caps, hunting/canvas bags]
      weapons: [CZ527, B95, Repeater, Izh43, Winchester 70, Izh18, MP-133, Ruger 10/22, farm tools, IJ-70]
    spawn_archetypes: [rural farmsteads, player base perimeters, roadside transport trucks]
    holds_roles: [inland_town]
    patrol_templates:
      farm_watch:      { at: held, kind: garrison, size: [2, 3], chance: 1.0, persist: true, respawn: 1800 }
      scavenger_party: { at: held, kind: perimeter, size: [2, 4], chance: 0.6, persist: false, respawn: -2,
                         behaviour: { Behaviour: LOOP, Speed: WALK, LootingBehaviour: "WEAPONS|BANDAGES|CLOTHING|UPGRADE" } }
    radio_voice:
      tone: frightened, practical, neighbourly; farmers and mechanics on cheap handhelds
      sample: "Anyone near the Vybor road? Jackal trucks heading east, bring the kids inside."

  Peacekeepers:
    display: UN Peacekeeping Remnants (Task Force Blue Shield)
    custom_faction: DZDSPeacekeepers
    interim_faction: Guards
    lore: Stranded UN mission holding humanitarian Green Zones, radar hubs and airfields.
    player_standing: armed neutrality (fire only if provoked inside their perimeter)
    stance: { Peacekeepers: friendly, Settlers: neutral, Jackals: hostile, Karkas: hostile, Rust: hostile, Infected: hostile }
    recruitable: false   # Guard-type; CanRecruitGuards stays off
    behaviour:
      Behaviour: HALT_OR_ALTERNATE
      Speed: WALK
      UnderThreatSpeed: JOG
      DefaultStance: STANDING
      Formation: Column
      FormationLooseness: 0.1
      AccuracyMin: 0.32
      AccuracyMax: 0.50
      ThreatDistanceLimit: 260.0
      NoiseInvestigationDistanceLimit: 150.0
      EnableFlankingOutsideCombat: 0
      LootingBehaviour: NONE
      CanBeLooted: false   # UN gear isn't free loot; keeps them worth respecting
    loadout:
      apparel: [UN blue ballistic helmets, blue berets, BDUs, M65 jackets, combat boots, UN plate carriers, assault packs]
      weapons: [M16A2, FAL, MP5K, Steyr AUG, FAMAS, M4A1, Mosin 91/30 (marksmen), SVD, Scout, Glock 19, FNX-45]
    spawn_archetypes: [road checkpoints, medical field stations, radar relay towers, cargo airfields]
    holds_roles: [airfield, military]
    patrol_templates:
      checkpoint:   { at: held, kind: garrison, size: [3, 4], chance: 1.0, persist: true, respawn: 2400,
                      behaviour: { Behaviour: HALT, DefaultStance: STANDING } }
      patrol_route: { at: held, kind: perimeter, size: [4, 6], chance: 0.7, persist: true, respawn: 3600 }
      officer_detail: { at: held, kind: garrison, size: [2, 2], chance: 0.3, persist: true, respawn: -1,
                        loadout_variant: officer, behaviour: { AccuracyMax: 0.52 } }
    radio_voice:
      tone: formal, procedural, multilingual call signs, weary professionalism
      sample: "This is Task Force Blue Shield at Checkpoint Charlie. Keep weapons slung on approach."

  Jackals:
    display: The Jackal Cohort
    custom_faction: DZDSJackals
    interim_faction: Raiders
    lore: Ruthless lowland nomads; highway ambushes and hit-and-run raids on aid convoys.
    player_standing: hostile
    stance: { Jackals: friendly, Settlers: hostile, Peacekeepers: hostile, Karkas: hostile, Rust: hostile, Infected: hostile }
    recruitable: false
    behaviour:
      Behaviour: ROAMING_LOCAL                 # was ROAMING (map-wide); stay near own sites (2026-10-12)
      Speed: JOG
      UnderThreatSpeed: SPRINT
      DefaultStance: STANDING
      Formation: RANDOM
      FormationLooseness: 0.9
      AccuracyMin: 0.24
      AccuracyMax: 0.40
      ThreatDistanceLimit: 220.0
      NoiseInvestigationDistanceLimit: 300.0   # they come to gunfire
      MaxFlankingDistance: 250.0
      EnableFlankingOutsideCombat: 1           # push and overwhelm
      LootingBehaviour: "WEAPONS|BANDAGES|CLOTHING|UPGRADE"  # strip bodies, but not food
      CanBeLooted: true
    loadout:
      apparel: [rider/leather jackets, bomber jackets, gas masks, skull balaclavas, cargo pants, combat boots, bandanas, duffels]
      weapons: [sawn-off Izh-43, MP-133, worn SKS, sawn-off Mosin, Repeater, CZ61 Skorpion, warlord AKM/AKS-74U, IJ-70, Colt 1911]
    spawn_archetypes: [dry-wash canyon ambushes, highway pileups, hilltop lookout campfires]
    holds_roles: [road_junction]
    patrol_templates:
      raid_party:     { at: contested, kind: roam, size: [4, 7], chance: 0.8, persist: false, respawn: -2 }
      ambush:         { at: contested, kind: ambush, size: [3, 5], chance: 0.8, persist: false, respawn: 2400,
                        behaviour: { Behaviour: HALT, DefaultStance: CROUCHED, EnableFlankingOutsideCombat: 0 } }
      highway_patrol: { at: held, kind: perimeter, size: [3, 5], chance: 0.8, persist: false, respawn: 2400,
                        behaviour: { Behaviour: LOOP, Speed: JOG } }
      camp_guard:     { at: held, kind: garrison, size: [2, 3], chance: 1.0, persist: true, respawn: 2400 }
    radio_voice:
      tone: jeering, predatory, slang-heavy; laughter and engine noise in the background
      sample: "Vultures on the ridge, light up that supply truck! Leave the blue helmets for the rotters!"

  Karkas:
    display: Karkas Mountain Clan
    custom_faction: DZDSKarkas
    interim_faction: Shamans          # built-in: hostile to all humans, wildlife leaves them alone
    lore: Isolationist mountain clansmen; see everyone else as invaders. Wildlife ignores them.
    player_standing: territorial hostile
    stance: { Karkas: friendly, Settlers: hostile, Peacekeepers: hostile, Jackals: hostile, Rust: hostile, Infected: hostile }
    recruitable: false
    behaviour:
      Behaviour: HALT
      Speed: WALK
      UnderThreatSpeed: WALK              # patient; hold the high ground
      DefaultStance: CROUCHED
      Formation: Wall
      FormationLooseness: 0.7
      AccuracyMin: 0.28
      AccuracyMax: 0.48
      ThreatDistanceLimit: 280.0
      NoiseInvestigationDistanceLimit: 120.0
      SniperProneDistanceThreshold: 120.0  # go prone for long shots
      EnableFlankingOutsideCombat: 0
      LootingBehaviour: WEAPONS
      CanBeLooted: true
    loadout:
      apparel: [ghillie suits/hoods, hunting jackets, ushanka fur hats, sweaters, hunting vests, mountain boots, hunting packs]
      weapons: [Mosin 91/30, CZ527, Winchester 70, SSG 82, Repeater, Izh18, elder SVD, hunting knives, Magnum, Deagle]
    spawn_archetypes: [ridge overlooks, mountain caves, stone ruins, canyon passes]
    holds_roles: [high_ground, remote]
    patrol_templates:
      ridge_watch:    { at: held, kind: garrison, size: [2, 3], chance: 1.0, persist: true, respawn: 3600,
                        behaviour: { DefaultStance: PRONE, Speed: WALK } }
      hunting_party:  { at: held, kind: roam, size: [2, 4], chance: 0.6, persist: false, respawn: -2,
                        behaviour: { Behaviour: ROAMING_LOCAL, LootingBehaviour: NONE } }
      elder_marksman: { at: held, kind: garrison, size: [1, 1], chance: 0.3, persist: true, respawn: -1,
                        loadout_variant: elder, behaviour: { AccuracyMax: 0.52, SniperProneDistanceThreshold: 80.0 } }
    radio_voice:
      tone: sparse, gravelly, proverbs and warnings; open airwaves, no call signs
      sample: "The high pass belongs to the Karkas. Turn your engines back or feed the crows."

  Rust:
    display: The Rust Syndicate
    custom_faction: DZDSRust
    interim_faction: Mercenaries
    lore: Industrial cartel monopolising wells, pumpjacks, rail yards and refineries.
    player_standing: hostile (exclusion perimeters)
    stance: { Rust: friendly, Settlers: hostile, Peacekeepers: hostile, Jackals: hostile, Karkas: hostile, Infected: hostile }
    recruitable: false
    behaviour:
      Behaviour: ALTERNATE                 # walk the perimeter back and forth
      Speed: WALK
      UnderThreatSpeed: JOG
      DefaultStance: STANDING
      Formation: Wall
      FormationLooseness: 0.2
      AccuracyMin: 0.26
      AccuracyMax: 0.44
      ThreatDistanceLimit: 240.0
      NoiseInvestigationDistanceLimit: 150.0
      EnableFlankingOutsideCombat: 0
      DamageReceivedMultiplier: 0.9        # plate-armoured enforcers
      LootingBehaviour: DEFAULT
      CanBeLooted: true
    loadout:
      apparel: [hard hats, welding/gas masks, tracksuits, bomber jackets, industrial jumpsuits, cargo pants, steel-toe boots, reflex vests]
      weapons: [Saiga-12, PP-19 Bizon, AK-74, AKS-74U, AS-VAL, MP-133, industrial tools (pipe wrenches, crowbars), flare guns, IJ-70]
    spawn_archetypes: [contested water wells, railway depots, fuel refineries, power substations]
    holds_roles: [industrial, water]
    patrol_templates:
      well_crew:        { at: held, kind: garrison, size: [3, 5], chance: 1.0, persist: true, respawn: 2400 }
      enforcer_patrol:  { at: held, kind: perimeter, size: [4, 6], chance: 0.6, persist: true, respawn: 3600,
                          behaviour: { Behaviour: LOOP } }
      foreman:          { at: held, kind: garrison, size: [1, 2], chance: 0.3, persist: true, respawn: -1,
                          loadout_variant: foreman, behaviour: { DamageReceivedMultiplier: 0.8 } }
    radio_voice:
      tone: corporate menace, shift-work jargon, numbered assets and quotas
      sample: "Syndicate command to pump crews: intruders near reservoir three. Lethal force authorised."

  Infected:
    display: The Infected
    custom_faction: null   # vanilla zombies, outside the faction system; attack every human
    interim_faction: null
    lore: Drawn by unsuppressed gunfire, turning two-way fights into three-way chaos.
    stance: { Infected: friendly, Settlers: hostile, Peacekeepers: hostile, Jackals: hostile, Karkas: hostile, Rust: hostile }

# 2026-10-15 (Badlands): every template stays inside its site's zone (garrison 35 m, perimeter
# 150 m, roam/ambush anchored on the site). Crossing open country is the ledger's war party
# only (presets/ledger.yaml war_party; spec §4.3). `route` is rejected by tools/patrol_gen.py.
# Patrol templates (tools/patrol_gen.py): at = held (sites the faction holds) | contested;
# kind = garrison (small loop around the site) | perimeter (wide loop) | roam (start at the site, wander) | ambush (hold one spot). size = [NumberOfAI,
# NumberOfAIMax]; respawn = seconds, -1 never, -2 Expansion's general setting; behaviour
# overrides the faction profile; loadout_variant picks DZDS_<Faction>_<variant> (rank).

# Recruitment (Expansion AI, from source): walk up and "Recruit" (come-here gesture), dismiss,
# open their inventory to equip them, command menu for formation/follow/goto/hold/get-in/flank.
recruitment:
  CanRecruitFriendly: true
  CanRecruitGuards: false
  MaxRecruitableAI: 4        # per player; budget-friendly (docs/LIVING_WORLD.md §5)

# ---- Resources: what the war is fought over (by map ROLE, so it ports to Nasdara) ---------
resources:
  water:    { from_roles: [water],               effect: settler growth; Rust leverage over everyone }
  fuel:     { from_roles: [industrial],          effect: convoy frequency and vehicle patrols }
  arms:     { from_roles: [military, airfield],  effect: better loadouts (accuracy stays in bounds) }
  food:     { from_roles: [inland_town],         effect: reinforcement rate (patrol size / respawn time) }
  # 2026-10-15: Nasdara has no coast (maps/nasdara.yaml role_min coastal_town: 0), so medicine
  # comes from military sites (field hospitals, medical containers) instead of coastal towns.
  medicine: { from_roles: [military],            effect: garrison resilience }

# ---- Initial front line for ChernarusPlus (location names from maps/chernarusplus.yaml) ---
initial_control:
  chernarusplus:
    Peacekeepers: [Balota Airfield, Northwest Airfield, Green Mountain, Zelenogorsk]
    Rust: [Chernogorsk, Elektrozavodsk, Berezino, Topolka Dam]
    Karkas: [Black Mountain, Altar, Tisy Military]
    Jackals: [Gorka]                       # nomads: one camp, mostly roaming roads
    Settlers: [Vybor, Novodmitrovsk]
    contested: [Stary Sobor, Severograd, Krasnostav]

  # Nasdara (maps/nasdara.yaml): compact strongholds + 2 warzones (spec §4.1). Picked 2026-10-15,
  # approved by Blae 2026-10-15; names are placeholders until he renames them.
  # Nasdara (maps/nasdara.yaml): compact strongholds + 2 warzones (spec §4.1). Picked 2026-10-15,
  # approved by Blae 2026-10-15; names are placeholders until he renames them.
  nasdara:
    Peacekeepers: [Eastern Airfield, Southwest Base]
    Rust: [Cement Works, Hilltop Water Station]
    Karkas: [Missile Base Ridge]
    Jackals: [North Highway Pileup]        # nomads: one camp, mostly roaming roads
    Settlers: [Eastern Caravanserai, Settler Haven]  # Eastern Caravanserai (Qalat-e Lut HQ) + Settler Haven
    contested: [Northern Dam, Southern Barracks]

# Global calibration lives in presets/expansion_ai_calibration.yaml (blueprint §4E values).
