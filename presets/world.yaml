# @DZDS world layer config (mods/DZDS/Scripts/4_World/DZDS/DZDSWorld.c).
# tools/dzds_profile.py writes server/profiles/DZDS/settings.json + markers.json from this and
# the war ledger. Classnames marked null are not chosen yet: pick real objects in-game (VPP
# object spawner) and fill them in; null entries are skipped, never guessed.

poll_seconds: 10

# Per-player tolerance (mods/DZDS/.../DZDSTolerance.c): Karkas and Rust AI leave alone a player
# whose Expansion Hardline reputation with that faction is at least this (earned via quests'
# FactionReputationRewards). 0 turns it off. [test] tune against quest reward sizes.
tolerance_reputation: 50

# Diegetic radio bulletin (mods/DZDS/Scripts/4_World/DZDS/DZDSBulletin.c): periodic Settler Net
# war dispatches delivered only to players carrying a powered, switched-on radio (no RCON needed).
bulletin:
  interval_seconds: 600
  frequency: "87.8 MHz"

# Site markers: placed at server start next to every site, showing who holds it.
markers:
  offset: [12, 12]          # metres from the site centre (keep markers off roads)
  by_holder:
    Peacekeepers: StaticObj_Mil_HBarrier_4m              # Hesco barrier: checkpoint
    Rust: StaticObj_Misc_Pallets2                        # industrial stockpile
    Karkas: StaticObj_Forest_DeerSkeleton_Skull          # bone totem
    Jackals: StaticObj_Misc_TirePile                     # raider tyre dump
    Settlers: StaticObj_Misc_HayBale_Packed_Stack        # farm winter stock
    contested: StaticObj_ShellCrater2_Small              # fought-over ground

# GM world actions (src/gamemaster/schema.py EventTarget) -> objects @DZDS may spawn.
# Everything listed here becomes the server-side spawn allowlist.
gm_actions:
  spawn_heli_crash:   { classnames: [Wreck_Mi8_Crashed], count: 1 }   # [verify] vanilla wreck object
  spawn_airdrop:      { classnames: [], count: 1 }                    # Airdrop-Upgraded crate classname TBD
  spawn_hacked_crate: { classnames: [], count: 1 }                    # BS HackedCrate classname TBD
  spawn_ai_patrol:    { classnames: [], count: 0 }                    # needs Expansion's spawn API: later
