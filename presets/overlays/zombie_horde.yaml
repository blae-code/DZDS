# SF Zombie Horde Event (Blae, 2026-10-12): rarer, and no longer spawning on top of players.
# From the mod's source (ZHordeEventManager.c): with AggroOnSpawn on, FindSpawnPosition uses
# AggroSpawnRadiusMin/Max (was 8-18 m) INSTEAD of SpawnRadiusMin/Max. It places infected at
# terrain height only (no building or water check), so they could land inside houses.
# "Aggro" only re-faces them toward the target three times; they always face the player
# on spawn anyway. Spawn-in-the-open needs a code override: deferred until this is tested.
# On-screen warnings stay on (Blae, 2026-10-12).
root: profiles
target: ZombieHorde/Settings/GeneralSettings.json
values:
  MinTimeBetweenEventsSeconds: 3600    # was 900
  MaxTimeBetweenEventsSeconds: 7200    # was 1800
  ZombiesPerWave: 5                    # was 10
  MaxAliveEventZombies: 15             # was 40
  AggroOnSpawn: 0                      # was 1 (which forced the 8-18 m radius below)
  SpawnRadiusMin: 120.0                # was 35
  SpawnRadiusMax: 200.0                # was 90
  AggroSpawnRadiusMin: 120.0           # was 8: kept equal so re-enabling aggro can't bring 8 m back
  AggroSpawnRadiusMax: 200.0           # was 18
  EventDurationSeconds: 300            # was 180: event infected are deleted when it ends,
                                       # so give 120-200 m spawns time to arrive
