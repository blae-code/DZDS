# Expansion-Market (docs/ECONOMY.md section 4): traders with BARTER currencies
# (presets/traders.yaml). Banking is abstract and non-diegetic, so ATMs stay off.
root: mission                          # $mission:expansion/settings/MarketSettings.json
target: expansion/settings/MarketSettings.json
values:
  MarketSystemEnabled: true
  ATMSystemEnabled: false
  ATMPlayerTransferEnabled: false
  ATMPartyLockerEnabled: false
