# Expansion AI: recruitment and kill logging (docs/FACTIONS.md).
# The player faction (DZDSSettlers) is in dzds_player_faction.yaml, gated on @DZDS.
root: profiles
target: ExpansionMod/Settings/AISettings.json
values:
  CanRecruitFriendly: true     # recruit Frontier Settlers
  CanRecruitGuards: false      # UN peacekeepers are not for hire
  MaxRecruitableAI: 4
  LogAIHitBy: true
  LogAIKilled: true
