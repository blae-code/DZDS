# Refugee column (Blae, 2026-10-15): all FIRST arrivals on the same day wake at the same
# arrival site; the site rotates daily in this order. A "day" starts at this UTC hour
# (11 = 06:00 US Central) so one evening's session never splits across two sites.
column_day_start_utc_hour: 11

# Respawn near where you died (Blae, 2026-10-15): a later character wakes on a road point
# 2-5 km from the previous character's death, else within 8 km, else anywhere (exclusions
# still apply). No recorded death (e.g. the server restarted mid-death) = anywhere, as before.
respawn_near_m: [2000, 5000]
respawn_near_fallback_m: 8000

# Camp respawn (Blae, 2026-10-16): a later character wakes beside the PITCHED tent nearest the
# previous character's death, if one stands within camp_respawn_m. Any player's tent counts
# (small co-op server). No car comes with a camp respawn and the car cooldown is untouched;
# with no tent in range, the road respawn above applies.
camp_respawn_m: 5000
camp_player_offset_m: 4.0

# Respawn near the others (Blae, 2026-10-22: "it's a massive map, and we spend the majority of
# the time just finding each other"). A later character wakes on a road or arrival spot within
# 1 km of another living player who is online, else within 2 km. This comes BEFORE the base,
# camp and near-death respawns (Blae chose "friend first"); with nobody else online they apply
# as before. The vehicle and its cooldown work as on any road respawn. First arrivals still go
# to the refugee column.
respawn_near_players_m: [1000, 2000]

# Base respawn (Blae, 2026-10-22): with nobody online to wake beside, a later character wakes
# at the base: beside the RAISED territory flag nearest the previous death, any distance, with
# no car (the base has its own) and the car cooldown untouched. A flag counts once its pole is
# built and a flag is on it, raised at least partway; vanilla lowers it as the base's refresh
# time runs out, so an abandoned base stops being a respawn. Needs @DZDS with DZDSBases
# (DZDS_BASES); without it this step is skipped.
base_respawn: true
base_player_offset_m: 5.0
