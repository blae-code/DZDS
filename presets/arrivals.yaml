# Refugee arrivals (Blae, 2026-10-12). Compiled by tools/arrivals.py (`make arrivals`) into
# profiles/DZDS/arrivals.json, which the mission's init.c reads at server start.
#
# - A player's FIRST character arrives at a refugee arrival site (maps/<map>.yaml
#   arrival_sites), in the look they chose.
# - Every later character (after a death) is a RANDOMLY generated survivor who wakes on a road.
# - Both wake at a campfire (Zen's Immersive Login, SpawnFire) beside a worn vehicle whose
#   paired key is in their pocket, with one archetype's road-scavenged kit in the cargo.
# - One vehicle per player per `cooldown_hours` of real time: a death inside that window
#   still respawns on a road, but without a vehicle (stops suicide-farming cars and gear).
#   A favored player's `cooldown_vehicles` are the exception (see favored).
# - A rare respawn (and every one of a favored player's characters) wakes in an `outfit`.
#
# Positions come from the mission's own vanilla vehicle spawn points (cfgeventspawns.xml):
# hand-placed, flat, clear and mostly roadside, each with the road's heading.

enabled: true
cooldown_hours: 24
random_character_on_respawn: true

player_offset_m: 9.0            # player wakes this far beside the car, off the road
fuel: [0.25, 0.5]               # fraction of tank
vehicle_health: [0.5, 0.7]
item_health: [0.45, 0.85]       # road-worn

snap_radius_m: 700              # arrival anchor -> roadside spot search radius
points_per_site: 8              # candidate spots per arrival site (one may be occupied)
road_events: [VehicleCivilianSedan, VehicleSedan02, VehicleHatchback02, VehicleOffroadHatchback, VehicleTruck01]
exclude_roles: [airfield, military, road_junction]   # no respawns beside UN bases or the Jackal camp
exclude_radius_m: 500
exclude_points: []              # extra no-respawn zones [x, z, radius]

# Respawn vehicles (Blae, 2026-10-16: "leverage the more unique and modded vehicles"). Weights
# were set to sum to 100; since the CnG UAZs and ArmA2 trucks went (10-21, 10-23) they sum to
# 76: 30 vanilla, 43 modded, 3 helicopters (~4 %). No armed or attack vehicles. Parts were resolved from each mod's config.bin
# (attachment slot -> part class, colour-matched; cargo/camo/keychain slots left empty) and
# every entry is proven by the local self-test (init.c VehicleSelfTest) before it ships.
# A vehicle that fits nowhere near the spawn point is re-drawn, so big helicopters are safe.
#
# Aircraft (Blae, 2026-10-22: "comes with the requisite gear in all attachments, especially
# inventory"). Every attachment slot the aircraft's config declares is filled (slot lists read
# from each mod's config.bin): Expansion-framework helis also get a desert camo net, a key
# chain, a wrench and a FULL jerrycan in their own slots; RedFalcon (RFFSHeli_*) helis get the
# 10x100 flight storage case, which is the R22's only inventory (its own cargo is 0x0) and
# where their kit goes. The one slot left empty is Tac_Radio: no loaded mod makes an item for
# it (unfillable_slots). An aircraft's cargo is a pilot profile (aircraft: true archetypes).
aircraft: &aircraft [ExpansionMh6, ExpansionGyrocopter, EXT_MH6, RFFSHeli_R22, RFFSHeli_LittleBird, ExpansionUh1h, EXT_Mi8_Civilian, EXT_UH1Y, RFFSHeli_UH1H]
aircraft_fuel: [0.6, 0.9]       # fraction of tank: enough to reach somewhere, not a full ferry
fuel_cans: [CanisterGasoline]   # filled with gasoline wherever they spawn (slot or cargo)
unfillable_slots: [Tac_Radio]   # the vehicle self-test ignores these when grading empty slots
