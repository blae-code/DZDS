  # Pilot profiles (Blae, 2026-10-22): an aircraft's cargo is always one of these, a ground
  # vehicle's never is. Same slot rules as above ("car" = airframe field repair), plus a FULL
  # jerrycan (fuel) and signalling (signal), so a pilot who sets down off-field can refuel,
  # patch the airframe and be found.
  # Blae 2026-10-22 ("packs and survival equipment they would have access to because of their
  # profession"): every pilot also gets a pack and a survival kit (first-aid kit, purification
  # tablets, heat pack...). The bush pilot carries what backcountry fliers keep aboard (rod and
  # hook together, snare, shovel, sewing kit, rain gear); the combat pilot an aircrew survival
  # vest, splint, rangefinder and head torch. Extra slots go after the standard ones, in order.
