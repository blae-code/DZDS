# Body kit (Blae, 2026-10-15): every new character also gets a PersonalRadio with a 9V battery,
# tuned to the Settler net and switched OFF, plus one road flare. Index 0 = the first channel
# in vanilla's list; the MHz value is read in-game (Task 19) and printed on the player page.
radio:
  settler_net_index: 0
give_roadflare: true

# Navigation kit (Blae, 2026-10-17): once per player per nav_kit.cooldown_hours of real time,
# a new character (first arrival or respawn) also gets a paper map and a GPS receiver with a
# 9V battery, switched ON. The walkie-talkie above already comes with every character. Items
# that don't fit on the body go in the arrival vehicle's cargo, else on the ground.
nav_kit:
  cooldown_hours: 24
  items: [ChernarusMap, GPSReceiver]

# Trailers (Blae, 2026-10-17): an arrival vehicle that can tow gets Simply's utility trailer
# parked behind it, unhitched, coupler at the hitch ("Attach trailer to car" at the drawbar).
# The trailer mod decides what can tow (4+ wheels, not a helicopter or boat); aircraft are
# also skipped here explicitly. Parts: its two wheels and the two tail-lamp bulbs.
# OFF (Blae, 2026-10-17): a trailer touching an infected crashes the server (Expansion AI's
# eAIDamageHandler calls CrewMember(DRIVER) on the driverless trailer). init.c also removes
# every trailer already in the world (ClearTrailers). Re-enable only once that is patched.
trailer:
  enabled: false
  class: DZT_UtilityTrailer
  parts: [HatchbackWheel, HatchbackWheel, HeadlightH7, HeadlightH7]
  skip: *aircraft

# Favored players (Blae, 2026-10-21): a listed player's vehicle is always drawn from their
# `vehicles` (at those vehicles' pool weights). It changes WHICH vehicle, never WHETHER: the
# cooldown still applies to `vehicles`. `id` is identity.GetId(), the id= in the ADM log.
# 2026-10-22: every aircraft EXCEPT the gyrocopter, whose 5x2 cargo can't hold a pilot kit (it
# has no flight-case slot either), so the kit would land on the ground beside it.
# 2026-10-23: `outfit` dresses every character of that player (first or later) in that outfit.
# `cooldown_vehicles`: inside the cooldown of `vehicles`, the player still gets one of these,
# with no cooldown of their own (Blae: "no 24 hour cooldown for vehicles, just helicopters").
# A player with cooldown_vehicles always has a vehicle, so the base and camp respawns (which
# give none) are skipped for them.
favored:
  - name: blae
    id: "eEbDg86Qv3w5T_ZJj-9b9BriMPuvigsufukc_oCLOAQ="
    # 2026-10-24: Expansion-framework helis only. Blae flies VKB sticks (tools/vkb_pad.py), and
    # RedFalcon helis steer by each input's SyncedValue (the network copy), so a stick's
    # continuous changes arrive in steps and the controls stutter. Expansion reads LocalValue,
    # interpolated, and flies smoothly.
    vehicles: [ExpansionMh6, EXT_MH6, ExpansionUh1h, EXT_Mi8_Civilian, EXT_UH1Y]
    outfit: soviet_special_forces
    cooldown_vehicles: [ExpansionUAZCargo_Green, ExpansionUAZ, ExpansionUAZRoofless_Black, ExpansionVodnik, CrSk_GAZ_3309_Cargo_Green]
    companion_chance: 1.0

# Companions (Blae, 2026-10-24): 50/50 chance for players other than Blae to spawn with a companion
# on fresh respawn (Blae always starts with one: companion_chance: 1.0).
# The 50% chance is divided based on thematic rarity:
#   - Dog companion: 60% relative weight (tamed loyal dog with vest/collar, dogtag, and bone summon item)
#   - Equipped horse: 30% relative weight (saddled, bridled, horseshoe, horsebags with archetype kit)
#     Only two archetypes start with a horse: Hunter (local) and Bedouin.
#   - NPC ally: 10% relative weight (friendly armed settler recruit grouping with the player)
companion:
  enabled: true
  chance: 0.50
  weights:
    dog: 60.0
    horse: 30.0
    npc: 10.0
  dog_classes:
    - Doggo_Follow1
    - Doggo_Follow2
    - Doggo_Follow3
    - Doggo_Follow4
    - Doggo_Follow5
  dog_vests:
    - dog_vest_black
    - dog_vest_sheriff
    - dog_vest_blackgreen
    - dog_collar
    - dog_collar_grey
  horse_breeds:
    - Animal_Horse_Brown
    - Animal_Horse_Chestnut
    - Animal_Horse_Chestnut_Light
    - Animal_Horse_Palomino
    - Animal_Horse_Liver
    - Animal_Horse_BuckSkin
    - Animal_Horse_Paint
    - Animal_Horse_Appaloosa
    - Animal_Horse_Gray
    - Animal_Horse_Black
    - Animal_Horse_Shadow
  horse_tack:
    - Saddle_Western
    - Bridle
    - HorseBags
    - HorseShoe

# Outfits (Blae, 2026-10-23): a starting archetype WORN on the body, instead of the civilian
# clothes every character otherwise wakes in. A favored player's `outfit` always applies; anyone
# else rolls each outfit's `chance` once per respawn (random character). A first arrival keeps
# the look the player chose. A dressed character's vehicle cargo is the outfit's own: its
# `aircraft_cargo` pilot profile in an aircraft, its `land_cargo` kit in anything else.
# variants: one is drawn per character, every slot filled and the camo matched. An entry is a
# class, or {class, attach} for an item carried on another (the Smersh bag rides on its vest).
# An attachment that won't fit goes into the inventory instead. Weapons: one `primary` on the
# shoulder plus the `sidearm`, each with `magazines` FULL magazines loose in the vest and packs.
