# Body kit (Blae, 2026-10-15): every new character also gets a PersonalRadio with a 9V battery,
# tuned to the Settler net and switched OFF, plus one road flare. Index 0 = the first channel
# in vanilla's list; the MHz value is read in-game (Task 19) and printed on the player page.
radio:
  settler_net_index: 0
give_roadflare: true

# Navigation kit (Blae, 2026-10-17): once per player per nav_kit.cooldown_hours of real time,
# a new character (first arrival or respawn) also gets a paper map and a GPS receiver with a
# 9V battery, switched ON. The walkie-talkie above already comes with every character. Items
# that don't fit on the body go in the arrival vehicle's cargo, else on the ground.
nav_kit:
  cooldown_hours: 24
  items: [ChernarusMap, GPSReceiver]

# Trailers (Blae, 2026-10-17): an arrival vehicle that can tow gets Simply's utility trailer
# parked behind it, unhitched, coupler at the hitch ("Attach trailer to car" at the drawbar).
# The trailer mod decides what can tow (4+ wheels, not a helicopter or boat); aircraft are
# also skipped here explicitly. Parts: its two wheels and the two tail-lamp bulbs.
# OFF (Blae, 2026-10-17): a trailer touching an infected crashes the server (Expansion AI's
# eAIDamageHandler calls CrewMember(DRIVER) on the driverless trailer). init.c also removes
# every trailer already in the world (ClearTrailers). Re-enable only once that is patched.
trailer:
  enabled: false
  class: DZT_UtilityTrailer
  parts: [HatchbackWheel, HatchbackWheel, HeadlightH7, HeadlightH7]
  skip: [ExpansionMh6, ExpansionGyrocopter, EXT_MH6, RFFSHeli_R22, RFFSHeli_LittleBird, ExpansionUh1h, EXT_Mi8_Civilian, EXT_UH1Y, RFFSHeli_UH1H]

# Refugee column (Blae, 2026-10-15): all FIRST arrivals on the same day wake at the same
# arrival site; the site rotates daily in this order. A "day" starts at this UTC hour
# (11 = 06:00 US Central) so one evening's session never splits across two sites.
column_day_start_utc_hour: 11

# Respawn near where you died (Blae, 2026-10-15): a later character wakes on a road point
# 2-5 km from the previous character's death, else within 8 km, else anywhere (exclusions
# still apply). No recorded death (e.g. the server restarted mid-death) = anywhere, as before.
respawn_near_m: [2000, 5000]
respawn_near_fallback_m: 8000

# Camp respawn (Blae, 2026-10-16): a later character wakes beside the PITCHED tent nearest the
# previous character's death, if one stands within camp_respawn_m. Any player's tent counts
# (small co-op server). No car comes with a camp respawn and the car cooldown is untouched;
# with no tent in range, the road respawn above applies.
camp_respawn_m: 5000
camp_player_offset_m: 4.0
