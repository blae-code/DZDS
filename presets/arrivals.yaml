# Arrival cargo (Blae, 2026-10-15): ONE archetype per car, slots drawn WITHOUT replacement
# (max_each 1, food 2), ~12-17 items + exactly one themed firearm. Item pools are disjoint
# within an archetype so no item appears twice.
# Blae 2026-10-16, after the first live arrival: every kit has a knife, one car-maintenance
# item and one camp item; a pistol arrives with its magazine (3-6 rounds) PLUS 4-8 spare
# rounds, a gun without a magazine with 6-12 loose rounds. Magazine and rounds go in the
# cargo (an attached magazine never reached the player); the firearm spawns first.
firearm_health: [0.45, 0.70]
car_items: &car [TireRepairKit, Wrench, Screwdriver, Pliers, SparkPlug, EpoxyPutty]
archetypes:
  deserter:
    weight: 30
    slots:
      clothing: { count: [2, 3], items: [USMCJacket_Desert, USMCPants_Desert, BoonieHat_Desert, MilitaryBoots_Beige, M65Jacket_Tan, CargoPants_Beige, AssaultBag_Desert, Keffiyeh_LightBrown] }
      water:    { count: [1, 2], items: [Canteen, WaterBottle] }
      food:     { count: [2, 3], max_each: 2, items: [TunaCan, SardinesCan, BakedBeansCan, Crackers] }
      medical:  { count: [2, 2], items: [BandageDressing, PainkillerTablets, CharcoalTablets, TetracyclineAntibiotics] }
      knife:    { count: [1, 1], items: [CombatKnife] }
      tools:    { count: [1, 2], items: [Compass, DuctTape, Binoculars] }
      extra:    { count: [1, 2], items: [Flashlight, Battery9V] }
      camp:     { count: [1, 1], items: [Matchbox, Pot, Rope] }
      car:      { count: [1, 1], items: *car }
    firearms:
      - { weapon: MakarovIJ70, magazine: Mag_IJ70_8Rnd, ammo: Ammo_380, rounds: [3, 6], spare: [4, 8] }
