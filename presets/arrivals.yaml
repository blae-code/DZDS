        medical:  { count: [2, 2], items: [Epinephrine, TetracyclineAntibiotics, Splint, CharcoalTablets, BandageDressing, Morphine, PainkillerTablets, SalineBagIV, IodineTincture] }
        knife:    { count: [1, 1], items: [AK_Bayonet, CombatKnife] }
        tools:    { count: [1, 2], items: [Rangefinder, Compass, Binoculars, WeaponCleaningKit, SewingKit, Lockpick, OrienteeringCompass] }
