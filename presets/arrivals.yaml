  soviet_special_forces:
    chance: 0.03
    health: [0.7, 1.0]
    variants:
      ttsko:        [Ssh68Helmet, BalaclavaMask_Green, TTsKOJacket_Camo, TTSKOPants, TTSKOBoots, TacticalGloves_Green, {class: SmershVest, attach: [SmershBag]}, AssaultBag_Ttsko, MilitaryBelt]
      gorka_summer: [MilitaryBeret_Red, BalaclavaMask_Green, GorkaEJacket_Summer, GorkaPants_Summer, MilitaryBoots_Black, TacticalGloves_Green, {class: SmershVest, attach: [SmershBag]}, AssaultBag_Ttsko, MilitaryBelt]
