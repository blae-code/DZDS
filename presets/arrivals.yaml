# within an archetype so no item appears twice.
# Blae 2026-10-16, after the first live arrival: every kit has a knife, one car-maintenance
# item and one camp item; a pistol arrives with its magazine (3-6 rounds) PLUS 4-8 spare
# rounds, a gun without a magazine with 6-12 loose rounds. Magazine and rounds go in the
# cargo (an attached magazine never reached the player); the firearm spawns first.
