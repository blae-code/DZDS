    sidearm: { weapon: MakarovIJ70, attach: [], magazine: Mag_IJ70_8Rnd, magazines: 2, rounds: 8 }
    aircraft_cargo: combat_pilot
    land_cargo:     # same rules as a ground archetype: knife, car and camp items, one worn firearm
      slots:
        clothing: { count: [2, 3], items: [TelnyashkaShirt, Ushanka_Green, Ushanka_Black, PilotkaCap, WinterMilitaryCoat_Grey, TTsKOJacket_Camo, TTSKOPants, TTSKOBoots, GorkaEJacket_Flat, GorkaPants_Flat, GorkaEJacket_Summer, GorkaPants_Summer, MilitaryBoots_Black, TacticalGloves_Green, BalaclavaMask_Green, Ssh68Helmet] }
        water:    { count: [1, 2], items: [WaterBottle, Canteen, FilteringBottle] }
