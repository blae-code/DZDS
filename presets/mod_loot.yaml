# Which modded items the Central Economy knows, and how many spawn (tools/mod_ce.py, `make mod-ce`).
#
# Until 2026-10-24 no mod's types file was registered on Nasdara: no modded item spawned as
# loot, and crafted or script-spawned modded items had no CE entry at all. Each enabled mod that
# ships CE files gets an entry here, keyed by Workshop ID (config/mods.yaml).
#
#   policy: author   the mod's own values (relaunch spec R3: "modded items at author defaults")
#           curated  the mod's values, then the filters below
#           none     nothing registered; `reason` says why
#   types / spawnabletypes: globs relative to the mod's Workshop folder
#   exclude: classname globs never registered
#   nominal_scale: nominal and min multiplied (rounded; an item the author spawns keeps >= 1)
#   usages: keep only these usage flags (an item left with none is not registered as loot)
#   min_tier: drop value tiers below this one (Tier1..Tier4)
#
# Never registered whatever the policy: classes vanilla types.xml already defines, and classes in
# our own dzds/types_dzds.xml (arrival vehicles and their parts).

mods:
  2663169692:
    name: MMG - Mightys Military Gear
    # 469 items at author values add 877 to Nasdara's military loot, whose clothing totals 1457
    # (+60 %). At 0.25 it is ~+30 % (decision 2 in the plan: change the scale to taste).
    policy: curated
    types: ["files/types/mmg_types_*.xml"]
    spawnabletypes: ["files/spawnabletypes/mmg_cfgspawnabletypes.xml"]
    exclude: ["*ADMIN*", "*Admin*"]
    usages: [Military, MilitaryWest, MilitaryEast, Police]
    min_tier: Tier3
    files_exclude: ["*ADMINGEAR*"]
    nominal_scale: 0.25
  3311720441:
    name: Gas Mask Overhaul
    policy: curated            # 23 masks at nominal 10 = 230 military gas masks
    types: ["types.xml"]
