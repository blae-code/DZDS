      Headgear: [Ushanka_Black, Ushanka_Green, GhillieHood_Woodland]
      Body:     [GhillieTop_Woodland, HunterJacket_Autumn, M65Jacket_Olive]
      Legs:     [HunterPants_Autumn, CargoPants_Green]
      Feet:     [HikingBoots_Brown, MilitaryBoots_Brown]
      Vest:     [HuntingVest]
      Back:     [HuntingBag]
      Shoulder: [Mosin9130, CZ527, Winchester70]
      Melee:    [HuntingKnife]
    cargo: [[Magnum, 0, 1], [Ammo_762x54, 1, 2], [Mag_CZ527_5rnd, 1, 2], [Ammo_308Win, 1, 2], [Ammo_357, 1, 1]]
