# Faction loadouts (Faction Blueprint §2) compiled by tools/loadouts.py into Expansion loadout
# JSON (format from Expansion's ExpansionPrefabObject: ClassName, Chance, Quantity, Health,
# InventoryAttachments[{SlotName, Items}], InventoryCargo, Sets) at
# server/profiles/ExpansionMod/Loadouts/DZDS_<Faction>[_<variant>].json.
#
# Items in a slot are alternatives (Expansion picks by Chance). Classnames are vanilla DayZ
# unless noted.
# cargo: [classname, min, max] items placed in the AI's inventory (pistols, ammo, mags, food).
# Pistols go in cargo: DayZ has no holster slot on the body.

