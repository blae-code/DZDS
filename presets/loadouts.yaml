      Body:     [RidersJacket_Black, BomberJacket_Black, QuiltedJacket_Black]
      Legs:     [CargoPants_Black, Jeans_Black]
      Feet:     [MilitaryBoots_Black, WorkingBoots_Grey]
      Mask:     [GasMask, BalaclavaMask_Black]
      Vest:     [ChestHolster, HuntingVest]
      Shoulder: [SawedoffIzh43Shotgun, Mp133Shotgun, SKS]
      Melee:    [Machete, BaseballBat]
    cargo: [[MakarovIJ70, 1, 1], [Ammo_12gaPellets, 1, 3], [Ammo_762x39, 1, 2], [Mag_IJ70_8Rnd, 1, 2]]
    variants:
      warlord:
        Shoulder: [AKM]
        Headgear: [GorkaHelmet]
        Vest:     [PlateCarrierVest]

  Karkas:
