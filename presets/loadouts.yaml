# Faction loadouts (Faction Blueprint §2) compiled by tools/loadouts.py into Expansion loadout
# JSON (format from Expansion's ExpansionPrefabObject: ClassName, Chance, Quantity, Health,
# InventoryAttachments[{SlotName, Items}], InventoryCargo, Sets) at
# server/profiles/ExpansionMod/Loadouts/DZDS_<Faction>[_<variant>].json.
#
# Items in a slot are alternatives (Expansion picks by Chance). Classnames are vanilla DayZ
# unless noted. They are NOT verified yet: `make loadouts-check` compares every classname
# against the mission's types files once the server files exist, and lists unknowns to fix.
# cargo: [classname, min, max] items placed in the AI's inventory (pistols, ammo, mags, food).
# Pistols go in cargo: DayZ has no holster slot on the body.

health: [0.55, 0.9]          # worn, lived-in gear

factions:
  Settlers:
    slots:
      Body:     [HunterJacket_Brown, HikingJacket_Blue, Shirt_BlueCheck, Shirt_GreenCheck, Hoodie_Green]
      Legs:     [Jeans_Blue, CargoPants_Beige, HunterPants_Brown, CanvasPants_Beige]
      Feet:     [WorkingBoots_Brown, HikingBoots_Brown]
      Headgear: [BeanieHat_Brown, BeanieHat_Green, BaseballCap_Blue]
      Back:     [HuntingBag, TaloonBag_Blue]
      Shoulder: [CZ527, B95, Repeater, Izh43Shotgun]
      Melee:    [Hatchet, Pitchfork]
    cargo: [[Mag_CZ527_5rnd, 1, 2], [Ammo_308Win, 1, 2], [Ammo_357, 1, 2], [Ammo_12gaPellets, 1, 2], [Apple, 0, 2]]
    variants: {}

  Peacekeepers:
    slots:
      Headgear: [BallisticHelmet_UN]            # [verify] UN blue helmet classname
      Body:     [BDUJacket, M65Jacket_Olive, M65Jacket_Tan]
      Legs:     [BDUPants, CargoPants_Green]
      Feet:     [CombatBoots_Black, CombatBoots_Green]
      Vest:     [PlateCarrierVest]
      Back:     [AssaultBag_Green]
      Shoulder: [M16A2, FAL, MP5K]
    cargo: [[Mag_STANAG_30Rnd, 2, 3], [Mag_FAL_20Rnd, 1, 2], [Mag_MP5_30Rnd, 1, 2], [BandageDressing, 1, 2]]
    variants:
      officer:
        Headgear: [Beret_UN]                      # [verify] blue beret classname
        Shoulder: [MP5K]
      marksman:
        Shoulder: [Mosin9130]

  Jackals:
